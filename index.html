<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePulse - ৬০০০+ আনলিমিটেড মুভি</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0c0f;
            color: #ffffff;
            min-height: 100vh;
        }
        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(11, 12, 15, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1f2029;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #e50914;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .search-container {
            display: flex;
            align-items: center;
            background: #16181f;
            border-radius: 30px;
            padding: 6px 15px;
            border: 1px solid #2a2c39;
            width: 320px;
            max-width: 100%;
        }
        .search-container input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            padding: 6px;
            font-size: 14px;
        }
        .search-container i {
            color: #888;
        }
        /* Filter Buttons */
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px 5%;
            overflow-x: auto;
            background: #0f1015;
        }
        .cat-btn {
            background: #1a1b24;
            color: #aaa;
            border: 1px solid #2a2c39;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
            white-space: nowrap;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #e50914;
            color: white;
            border-color: #e50914;
        }
        /* Grid */
        .container {
            padding: 20px 5%;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #8c8d96;
            font-size: 14px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
        }
        .card {
            background: #14151d;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #1f2029;
        }
        .card:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            background: #1a1b24;
        }
        .card-content {
            padding: 10px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 12px;
            color: #8c8d96;
        }
        .rating {
            color: #ffc107;
            font-weight: bold;
        }
        /* Load More Button */
        .load-more-container {
            text-align: center;
            padding: 40px 0;
        }
        .load-more-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .load-more-btn:hover {
            background: #b80710;
            transform: scale(1.05);
        }
        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal-box {
            width: 90%;
            max-width: 900px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #16181f;
        }
        .modal-close {
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .server-select {
            padding: 10px 20px;
            background: #111;
            display: flex;
            gap: 10px;
        }
        .server-select button {
            background: #222;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .server-select button.active {
            background: #e50914;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="resetAndLoad('/discover/movie?sort_by=popularity.desc', '🔥 সব জনপ্রিয় মুভি')">CinePulse</div>
        <div class="search-container">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="যেকোনো মুভির নাম খুঁজুন..." onkeyup="search()">
        </div>
    </nav>

    <div class="categories">
        <button class="cat-btn active" onclick="switchCategory('/discover/movie?sort_by=popularity.desc', '🔥 সব জনপ্রিয় মুভি', this)">🔥 সব জনপ্রিয়</button>
        <button class="cat-btn" onclick="switchCategory('/movie/top_rated?', '⭐ টপ রেটেড মুভি', this)">⭐ টপ রেটেড</button>
        <button class="cat-btn" onclick="switchCategory('/discover/movie?with_genres=28', 'অ্যাকশন মুভি', this)">অ্যাকশন</button>
        <button class="cat-btn" onclick="switchCategory('/discover/movie?with_genres=35', 'কমেডি মুভি', this)">কমেডি</button>
        <button class="cat-btn" onclick="switchCategory('/discover/movie?with_genres=27', 'হরর মুভি', this)">হরর</button>
        <button class="cat-btn" onclick="switchCategory('/discover/movie?with_genres=878', 'সাই-ফাই মুভি', this)">সাই-ফাই</button>
        <button class="cat-btn" onclick="switchCategory('/discover/movie?with_genres=16', 'অ্যানিমেশন', this)">অ্যানিমেশন</button>
    </div>

    <div class="container">
        <div class="stats-bar">
            <h2 id="pageTitle" style="font-size: 18px; color: #fff;">সব জনপ্রিয় মুভি</h2>
            <div>মোট লোড হয়েছে: <b id="movieCount" style="color: #e50914;">0</b> টি মুভি</div>
        </div>
        
        <div class="movie-grid" id="movieGrid"></div>

        <div class="load-more-container">
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadNextPage()">👇 আরও ২০টি মুভি লোড করুন (Load More)</button>
        </div>
    </div>

    <!-- প্লেয়ার পপ-আপ -->
    <div class="modal" id="playerModal">
        <div class="modal-box">
            <div class="modal-header">
                <span id="playerMovieTitle">মুভি লোড হচ্ছে...</span>
                <span class="modal-close" onclick="closePlayer()">&times;</span>
            </div>
            <div class="server-select">
                <span>সার্ভার:</span>
                <button class="active" onclick="switchServer(1)">সার্ভার ১</button>
                <button onclick="switchServer(2)">সার্ভার ২</button>
            </div>
            <div class="video-wrapper">
                <iframe id="movieFrame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '8265bd1679663a7ea12ac168da84d2e8';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let currentPage = 1;
        let currentEndpoint = '/discover/movie?sort_by=popularity.desc';
        let currentMovieId = null;
        let totalLoaded = 0;
        let isLoading = false;

        const movieGrid = document.getElementById('movieGrid');
        const modal = document.getElementById('playerModal');
        const movieFrame = document.getElementById('movieFrame');
        const playerMovieTitle = document.getElementById('playerMovieTitle');
        const pageTitle = document.getElementById('pageTitle');
        const movieCount = document.getElementById('movieCount');

        async function fetchMovies(page = 1, append = false) {
            if (isLoading) return;
            isLoading = true;

            const separator = currentEndpoint.includes('?') ? '&' : '?';
            const url = `${BASE_URL}${currentEndpoint}${separator}api_key=${API_KEY}&page=${page}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (!append) {
                    movieGrid.innerHTML = '';
                    totalLoaded = 0;
                }

                renderCards(data.results);
                totalLoaded += data.results.length;
                movieCount.innerText = totalLoaded;
            } catch (err) {
                console.error(err);
            } finally {
                isLoading = false;
            }
        }

        function renderCards(movies) {
            movies.forEach(movie => {
                if (!movie.poster_path) return;
                const card = document.createElement('div');
                card.classList.add('card');
                card.onclick = () => openPlayer(movie.id, movie.title || movie.name);

                card.innerHTML = `
                    <img src="${IMG_URL + movie.poster_path}" alt="${movie.title}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${movie.title || movie.name}</div>
                        <div class="card-meta">
                            <span>${(movie.release_date || 'N/A').split('-')[0]}</span>
                            <span class="rating"><i class="fa fa-star"></i> ${movie.vote_average.toFixed(1)}</span>
                        </div>
                    </div>
                `;
                movieGrid.appendChild(card);
            });
        }

        function loadNextPage() {
            currentPage++;
            fetchMovies(currentPage, true);
        }

        // নিচে স্ক্রোল করলে অটোমেটিক মুভি লোড হওয়া (Infinite Scroll)
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                loadNextPage();
            }
        });

        function switchCategory(endpoint, title, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            currentPage = 1;
            currentEndpoint = endpoint;
            pageTitle.innerText = title;
            fetchMovies(currentPage, false);
        }

        let searchTimer;
        function search() {
            clearTimeout(searchTimer);
            const query = document.getElementById('searchInput').value.trim();
            if(!query) {
                switchCategory('/discover/movie?sort_by=popularity.desc', '🔥 সব জনপ্রিয় মুভি', document.querySelector('.cat-btn'));
                return;
            }
            searchTimer = setTimeout(() => {
                currentPage = 1;
                currentEndpoint = `/search/movie?query=${encodeURIComponent(query)}`;
                pageTitle.innerText = `"${query}" এর ফলাফল`;
                fetchMovies(currentPage, false);
            }, 500);
        }

        function openPlayer(id, title) {
            currentMovieId = id;
            playerMovieTitle.innerText = title;
            switchServer(1);
            modal.style.display = 'flex';
        }

        function switchServer(serverNum) {
            if(!currentMovieId) return;
            const buttons = document.querySelectorAll('.server-select button');
            buttons.forEach((btn, idx) => {
                btn.classList.toggle('active', idx === serverNum - 1);
            });

            if(serverNum === 1) {
                movieFrame.src = `https://vidsrc.to/embed/movie/${currentMovieId}`;
            } else {
                movieFrame.src = `https://multiembed.mov/?video_id=${currentMovieId}&tmdb=1`;
            }
        }

        function closePlayer() {
            modal.style.display = 'none';
            movieFrame.src = '';
            currentMovieId = null;
        }

        // প্রথম পেজ লোড
        fetchMovies(1, false);
    </script>
</body>
</html>
